name: Cross-platform workflow

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check runtime and maintenance dependencies
        run: python -c "import PIL, yaml"
      - name: Compile Python scripts
        run: python -m compileall -q skill/generate-inuyasha-manga-art/scripts
      - name: Run unit tests
        run: python -m unittest discover -s skill/generate-inuyasha-manga-art/tests -v
      - name: Check Windows setup and PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\setup-windows.ps1 -SkipCatalogBuild
          $skill = "$HOME\.agents\skills\generate-inuyasha-manga-art"
          $env:INUYASHA_PYTHON = Join-Path $env:RUNNER_TEMP "missing-python.exe"
          try {
            & "$skill\scripts\run-python.ps1" -c "print('must-not-run')"
            throw "The launcher accepted a missing explicit interpreter."
          } catch {
            if ($_ -notmatch "not executable") { throw }
          }
          Remove-Item Env:INUYASHA_PYTHON
          & "$skill\scripts\run-python.ps1" `
            "$skill\scripts\build_reference_index.py" --help
      - name: Check POSIX launcher
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          skill/generate-inuyasha-manga-art/scripts/run-python
          skill/generate-inuyasha-manga-art/scripts/build_reference_index.py
          --help
